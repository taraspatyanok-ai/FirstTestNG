name: Java CI with TestNG and Allure

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 25
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Run Tests with Maven
      run: mvn clean test
      continue-on-error: true

    - name: Install Allure CLI
      run: sudo npm install -g allure-commandline --unsafe-perm --silent

    - name: Generate Allure Report
      run: |
        mkdir -p target/allure-results
        allure generate target/allure-results -o allure-report-dir --clean
        
        if [ ! -f "allure-report-dir/index.html" ]; then
          mkdir -p allure-report-dir
          echo "<h1>Allure Report: Тести запущено, але результати порожні. Перевірте лог mvn clean test.</h1>" > allure-report-dir/index.html
        fi

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report-dir

  # Виносимо деплой в окремий джоб, як цього вимагає безпека GitHub
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Deploy Allure Report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
