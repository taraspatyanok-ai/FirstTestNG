name: Java CI with TestNG and Allure

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Глобально вимикаємо вивід попереджень про застарілі версії Node у консоль GitHub Actions
env:
  ACTIONS_STEP_DEBUG: false
  ACTIONS_RUNNER_DEBUG: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 25
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Run Tests with Maven
      run: mvn clean test
      continue-on-error: true

    - name: Install Allure CLI
      run: sudo npm install -g allure-commandline --unsafe-perm --silent

    - name: Get Allure history
      uses: actions/checkout@v4.2.2
      with:
        ref: gh-pages
        path: allure-history-old
      continue-on-error: true

    - name: Copy Allure history to results
      run: |
        mkdir -p target/allure-results
        if [ -d "allure-history-old/history" ]; then
          cp -r allure-history-old/history target/allure-results/
        fi

    - name: Generate Allure Report
      run: |
        allure generate target/allure-results -o allure-report-dir --clean
        if [ ! -f "allure-report-dir/index.html" ]; then
          mkdir -p allure-report-dir
          echo "<h1>No tests were executed or allure-results is empty</h1>" > allure-report-dir/index.html
        fi

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report-dir
