name: Java CI with TestNG and Allure

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests with Maven
      run: mvn clean test
      continue-on-error: true

    # Завантажуємо офіційний Allure CLI напряму в систему
    - name: Install Allure CLI
      run: |
        curl -o allure-2.29.0.tgz -QsSL https://github.com
        tar -zxf allure-2.29.0.tgz
        sudo ln -s $(pwd)/allure-2.29.0/bin/allure /usr/bin/allure

    # Скачуємо історію попередніх звітів, якщо вона є
    - name: Get Allure history
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: allure-history-old
      continue-on-error: true

    # Копіюємо історию в результати, щоб графіки в звіті працювали
    - name: Copy Allure history to results
      run: |
        mkdir -p target/allure-results
        if [ -d "allure-history-old/history" ]; then
          cp -r allure-history-old/history target/allure-results/
        fi

    # Генеруємо звіт консольною командою без жодних докерів
    - name: Generate Allure Report
      run: |
        allure generate target/allure-results -o allure-report-dir --clean
        # Якщо папка порожня (тести не створили джейсони), робимо заглушку, щоб деплой не падав
        if [ ! -f "allure-report-dir/index.html" ]; then
          mkdir -p allure-report-dir
          echo "<h1>No tests were executed or allure-results is empty</h1>" > allure-report-dir/index.html
        fi

    # Публікуємо готовий звіт в GitHub Pages
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report-dir
